<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İman Power | Cyber Disco V7</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --bg: #020006; --glass: rgba(8, 2, 18, 0.88); --accent: #ff0055; --neon-blue: #00f0ff; --neon-purple: #9d00ff; --text: #f3f4f6; }
        body { background: var(--bg); color: var(--text); font-family: 'Poppins', sans-serif; margin: 0; min-height: 100vh; }
        
        /* GİRİŞ EKRANI */
        #auth-screen { position: fixed; inset: 0; background: #010003; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--glass); padding: 40px; border-radius: 30px; border: 2px solid var(--accent); text-align: center; width: 350px; box-shadow: 0 0 50px rgba(255,0,85,0.3); }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #333; background: #0a0416; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 12px; color: white; font-weight: 800; cursor: pointer; transition: 0.3s; }
        
        /* DASHBOARD */
        #main-content { display: none; padding: 20px; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
        .card { background: var(--glass); padding: 20px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .troll-text { font-size: 2.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 20px var(--accent); text-align: center; margin: 20px 0; }
        .cat-box img { width: 200px; display: block; margin: auto; filter: drop-shadow(0 0 20px var(--neon-purple)); }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="logo.png" style="width:100px; border-radius:50%; border:2px solid var(--accent); margin-bottom:20px;">
            <input type="text" id="user-in" placeholder="Kullanıcı Adı">
            <input type="password" id="pass-in" placeholder="Şifre">
            <button class="btn" onclick="enterParty()">SALONA GİRİŞ YAP</button>
        </div>
    </div>

    <div id="main-content">
        <div class="grid">
            <div class="card">
                <h3>🎵 Çalan Şarkı</h3>
                <div id="now-playing">Yükleniyor...</div>
                <div id="player-container" style="display:none;"></div>
            </div>
            <div class="card">
                <div id="live-troll-text" class="troll-text">PARTİ BAŞLIYOR...</div>
                <div class="cat-box"><img src="https://media.tenor.com/Zuo6pA_wE78AAAAi/cat-dance.gif"></div>
            </div>
        </div>
        
        <!-- ADMIN PANEL -->
        <div class="card" style="margin-top:20px;">
            <h3>🛠️ Admin Masası</h3>
            <input type="text" id="adm-troll" placeholder="Kudurtucu Söz">
            <button class="btn" onclick="updateTroll()">GÜNCELLE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcOlvpqDTBvWuSdrk",
            authDomain: "imanpowerveri.firebaseapp.com",
            databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com",
            projectId: "imanpowerveri",
            storageBucket: "imanpowerveri.firebasestorage.app",
            messagingSenderId: "891464029314",
            appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let player;

        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('player-container', {
                videoId: 'dQw4w9WgXcQ',
                events: { 'onStateChange': (e) => { if(e.data === 0) player.playVideo(); } }
            });
        };

        window.enterParty = () => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            if(player) {
                player.unMute();
                player.playVideo();
            }
        };

        window.updateTroll = () => {
            const text = document.getElementById('adm-troll').value;
            set(ref(db, 'fun_settings/trollText'), text);
        };

        onValue(ref(db, '/'), (snap) => {
            const data = snap.val();
            if(data?.fun_settings?.trollText) {
                document.getElementById('live-troll-text').innerText = data.fun_settings.trollText;
            }
        });
    </script>
</body>
</html>
