<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İman Power | Cyber Party</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root { --bg: #020006; --accent: #ff0055; --neon: #00f0ff; --glass: rgba(255,255,255,0.05); }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        
        /* Giriş Ekranı */
        #auth-screen { position: fixed; inset: 0; background: radial-gradient(circle, #1a0b1e, #020006); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-box { background: var(--glass); padding: 40px; border-radius: 30px; border: 1px solid var(--accent); backdrop-filter: blur(15px); text-align: center; width: 320px; }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: none; background: #111; color: white; }
        .login-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* Ana İçerik */
        .dashboard { display: none; padding: 20px; max-width: 1000px; margin: auto; }
        .flex-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: var(--glass); padding: 20px; border-radius: 20px; border: 1px solid var(--neon); flex: 1; }
        
        /* Dans Eden Kedi */
        .cat-stage { text-align: center; margin-top: 30px; }
        .cat-stage img { width: 250px; filter: drop-shadow(0 0 20px var(--neon)); }
        
        .troll-text { font-family: 'Orbitron'; font-size: 2rem; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h2 style="font-family: 'Orbitron';">CYBER DISCO</h2>
            <input type="text" id="user" placeholder="Kullanıcı Adı">
            <input type="password" id="pass" placeholder="Şifre">
            <button class="login-btn" onclick="startParty()">SALONA GİR</button>
        </div>
    </div>

    <div id="main-content" class="dashboard">
        <div class="flex-container">
            <div class="card">
                <h3>🎵 Çalan Şarkı</h3>
                <p id="current-track-name">Yükleniyor...</p>
                <div id="hidden-player" style="display:none;"></div>
            </div>
            <div class="card">
                <h3>🔥 Anlık Durum</h3>
                <div id="troll-display" class="troll-text">PARTİ BAŞLIYOR!</div>
            </div>
        </div>

        <div class="cat-stage">
            <img src="https://media.tenor.com/Zuo6pA_wE78AAAAi/cat-dance.gif" alt="Dancing Cat">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Firebase ve YouTube ayarları buraya gelecek (Eski kodundaki config ile aynı)
        const firebaseConfig = { /* ... */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let player;
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('hidden-player', {
                videoId: 'dQw4w9WgXcQ',
                events: { 'onStateChange': (e) => { if(e.data === 0) player.playVideo(); } } // Sürekli tekrar
            });
        };

        window.startParty = () => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            if(player) {
                player.unMute();
                player.playVideo();
            }
        };

        // Veritabanından gelen verileri anlık güncelleme
        onValue(ref(db, '/'), (snapshot) => {
            const data = snapshot.val();
            // Kudurtucu sözü güncelle
            document.getElementById('troll-display').innerText = data.fun_settings.trollText;
            // Işıklar (Basit bir örnek)
            document.body.style.filter = data.fun_settings.lightsStatus === 'off' ? 'grayscale(1)' : 'none';
        });
    </script>
</body>
</html>
