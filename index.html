<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İman Power | Yeni Nesil Disco</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --accent: #10b981; --glass: rgba(20, 20, 20, 0.8); }
        * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: white; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }

        /* HEADER */
        header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; }
        .logo { font-family: 'Orbitron'; font-size: 1.5rem; color: var(--accent); }
        .btn { background: var(--accent); border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* MAİN LAYOUT */
        main { display: grid; grid-template-columns: 1fr 350px; gap: 20px; padding: 20px; flex-grow: 1; }
        
        /* TOXİK CHAT */
        .chat-box { background: var(--glass); border-radius: 15px; padding: 20px; height: 500px; display: flex; flex-direction: column; }
        #chat-messages { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; font-size: 0.9rem; }
        .msg { margin-bottom: 8px; border-left: 2px solid var(--accent); padding-left: 10px; }

        /* PLAYER */
        .video-box { background: #000; border-radius: 15px; overflow: hidden; height: 300px; }
        
        /* MODAL */
        #admin-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #111; padding: 30px; border-radius: 20px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <header>
        <div class="logo">İMAN POWER</div>
        <button class="btn" onclick="document.getElementById('admin-modal').style.display='flex'">YÖNETİCİ GİRİŞİ</button>
    </header>

    <main>
        <div class="chat-box">
            <h3 style="color:var(--accent);">TOXİK MESAJLAR</h3>
            <div id="chat-messages"></div>
            <input type="text" id="chat-in" placeholder="Mesaj yaz..." style="padding:10px; border-radius:8px; border:none;">
            <button class="btn" style="margin-top:5px;" onclick="sendMessage()">GÖNDER</button>
        </div>

        <div>
            <div class="video-box" id="yt-player"></div>
            <div style="margin-top:20px;">
                <button class="btn" onclick="startAudio()">SİSTEMİ BAŞLAT</button>
            </div>
        </div>
    </main>

    <div id="admin-modal">
        <div class="modal-content">
            <h3>Admin Şifresi</h3>
            <input type="password" id="admin-pass" style="padding:10px; width:100%; margin-bottom:10px;">
            <button class="btn" onclick="checkAdmin()">GİRİŞ</button>
            <div id="admin-panel" style="display:none; margin-top:20px;">
                <input type="text" id="new-yt" placeholder="Yeni Video ID" style="padding:10px; width:100%;">
                <button class="btn" style="margin-top:10px;" onclick="updateVideo()">VİDEOYU GÜNCELLE</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Senin Orijinal Firebase Ayarların
        const firebaseConfig = {
            apiKey: "AIzaSyDebenlp7KcVZ2oE90iEHTTl2oEuGFVGKs",
            authDomain: "kartalhaber-49ae6.firebaseapp.com",
            databaseURL: "https://kartalhaber-49ae6-default-rtdb.firebaseio.com",
            projectId: "kartalhaber-49ae6",
            storageBucket: "kartalhaber-49ae6.firebasestorage.app",
            messagingSenderId: "804745909398",
            appId: "1:804745909398:web:d4ecaf7174886bbe835eb7"
        };
        const db = getDatabase(initializeApp(firebaseConfig));
        let player;

        // YOUTUBE
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('yt-player', { height: '300', width: '100%', videoId: 'EY07kVGs_Jk', playerVars: { 'autoplay': 1, 'mute': 0 } });
        };
        window.startAudio = () => { if(player) player.playVideo(); };

        // CHAT (TOXİK)
        window.sendMessage = () => {
            const msg = document.getElementById('chat-in').value;
            if(msg) push(ref(db, 'toxic_chat'), { text: msg, time: Date.now() });
            document.getElementById('chat-in').value = "";
        };

        onValue(ref(db, 'toxic_chat'), (snap) => {
            const container = document.getElementById('chat-messages');
            container.innerHTML = "";
            snap.forEach((child) => {
                container.innerHTML += `<div class="msg">${child.val().text}</div>`;
            });
            container.scrollTop = container.scrollHeight;
        });

        // ADMIN
        window.checkAdmin = () => {
            if(document.getElementById('admin-pass').value === "imanpoweradmini31") {
                document.getElementById('admin-panel').style.display = 'block';
            } else { alert("Yanlış şifre!"); }
        };
        window.updateVideo = () => {
            const newId = document.getElementById('new-yt').value;
            set(ref(db, 'current_song'), { videoId: newId });
        };
        onValue(ref(db, 'current_song'), (snap) => {
            if(snap.exists() && player) player.loadVideoById(snap.val().videoId);
        });
    </script>
</body>
</html>
