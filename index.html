<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power | Cyber Disco V7</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        /* CSS Kısmı aynı kalıyor, sadece yapısal olarak korundu */
        :root { --bg: #020006; --glass: rgba(8, 2, 18, 0.88); --accent: #ff0055; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; }
        #auth-screen { position: fixed; inset: 0; background: #010003; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--glass); padding: 45px; border-radius: 30px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 420px; }
        input { width: 100%; padding: 14px; margin-bottom: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #0a0416; color: white; }
        .btn { padding: 14px; border: none; border-radius: 12px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; }
    </style>
</head>
<body>

    <div id="hidden-audio-player" style="position:absolute; top:-9999px;"></div>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="image_a2cd46.png" onerror="this.src='logo.png'" style="width:100px; border-radius:50%; margin-bottom:20px;">
            <h2 id="auth-title" style="color:var(--accent);">CYBER DISCO</h2>
            <input type="text" id="fun-user-in" placeholder="Kullanıcı Adı">
            <input type="password" id="fun-pass-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleFunAuth()">SALONA GİRİŞ YAP</button>
        </div>
    </div>

    <div class="main-layout">
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcOlvpqDTBvWuSdrk",
            authDomain: "imanpowerveri.firebaseapp.com",
            databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com", 
            projectId: "imanpowerveri",
            storageBucket: "imanpowerveri.firebasestorage.app",
            messagingSenderId: "891464029314",
            appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let audioPlayer = null;

        // YouTube API Hazırlığı
        window.onYouTubeIframeAPIReady = () => {
            audioPlayer = new YT.Player('hidden-audio-player', {
                videoId: 'dQw4w9WgXcQ', // Varsayılan video
                playerVars: { 'autoplay': 0, 'controls': 0 }
            });
        };

        // GİRİŞ YAP VE SESİ TETİKLE
        window.handleFunAuth = () => {
            // 1. SESİ BAŞLAT (Tarayıcı kısıtlamasını aşar)
            if(audioPlayer) {
                audioPlayer.unMute();
                audioPlayer.playVideo();
            }

            // 2. VERİTABANI İŞLEMLERİNİ YAP (Orijinal giriş mantığın)
            const user = document.getElementById('fun-user-in').value;
            if(user) {
                document.getElementById('auth-screen').style.display = 'none';
                console.log("Ses başlatıldı ve panele girildi.");
            }
        };
        
        // ... (Orijinal veritabanı dinleyicilerin ve admin fonksiyonların buraya gelecek)
    </script>
</body>
</html>
