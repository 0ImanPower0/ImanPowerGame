<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power | Eğlence Odası</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #02040a;
            --glass: rgba(10, 15, 30, 0.88);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text: #f3f4f6;
            --border: rgba(16, 185, 129, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; position: relative; }

        /* ARKA PLAN EFEKTLERİ */
        .strobe-bg-effect { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; animation: strobeFlash 1.2s steps(1, end) infinite; }
        @keyframes strobeFlash {
            0%, 100% { opacity: 0; background: transparent; }
            10% { opacity: 0.25; background: #ff0055; filter: blur(50px); }
            12% { opacity: 0; }
            30% { opacity: 0.3; background: #00ffcc; filter: blur(60px); }
            33% { opacity: 0; }
            50% { opacity: 0.25; background: #9900ff; filter: blur(50px); }
            52% { opacity: 0; }
            70% { opacity: 0.35; background: #10b981; filter: blur(70px); }
            73% { opacity: 0; }
            85% { opacity: 0.3; background: #eab308; filter: blur(50px); }
            88% { opacity: 0; }
        }

        .ambient-party-lights { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .spot { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: pulseSpot 3s ease-in-out infinite alternate; }
        .spot-1 { top: -50px; left: 15%; background: #ef4444; }
        .spot-2 { bottom: 10%; right: 10%; background: #3b82f6; animation-delay: 0.5s; }
        .spot-3 { top: 40%; left: 45%; background: #a855f7; animation-delay: 1.5s; }
        @keyframes pulseSpot { 0% { transform: scale(0.8); opacity: 0.3; filter: hue-rotate(0deg); } 100% { transform: scale(1.4); opacity: 0.6; filter: hue-rotate(360deg); } }

        /* GİRİŞ PANELİ */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-card { background: var(--glass); padding: 40px; border-radius: 24px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 40px var(--accent-glow); backdrop-filter: blur(12px); }
        .auth-card img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 20px; object-fit: cover; }

        /* LAYOUT */
        .main-layout { position: relative; z-index: 5; max-width: 1300px; margin: 0 auto; padding: 25px 20px; display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media (min-width: 768px) { .main-layout { grid-template-columns: 1fr 1fr; } }

        .fun-header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .logo-section { display: flex; align-items: center; gap: 12px; font-family: 'Orbitron'; font-weight: 900; color: var(--accent); font-size: 1.1rem; }
        .logo-section img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); }

        /* SOL TARAF: MÜZİK PANELİ */
        .music-panel { background: var(--glass); border-radius: 24px; border: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; gap: 15px; height: 100%; justify-content: center; }
        .panel-title { font-family: 'Orbitron'; font-size: 1rem; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .now-playing-box { background: rgba(16, 185, 129, 0.06); border: 1px solid var(--border); padding: 30px 15px; border-radius: 16px; text-align: center; }
        
        @keyframes pulseBtnGlow { 0% { box-shadow: 0 0 5px #10b981; } 50% { box-shadow: 0 0 25px #10b981, 0 0 40px #10b981; } 100% { box-shadow: 0 0 5px #10b981; } }
        .force-play-btn { width: 100%; padding: 15px; font-weight: 900; font-family: 'Orbitron'; background: #10b981; border: none; border-radius: 10px; color: #fff; cursor: pointer; animation: pulseBtnGlow 1.5s infinite; transition: 0.3s; font-size: 1.1rem; }

        /* SAĞ TARAF: KUDURTUCU SÖZÜ (CENTER STAGE) */
        .center-stage { background: var(--glass); border-radius: 24px; border: 1px solid var(--border); padding: 35px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; height: 100%; min-height: 250px; }
        .troll-text { font-family: 'Orbitron'; font-size: 2rem; font-weight: 900; color: #f43f5e; animation: pulseText 0.8s infinite alternate; text-transform: uppercase; word-break: break-word; }
        @keyframes pulseText { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        /* ALT TARAF: GITHUB VİDEO */
        .video-box-container { grid-column: 1 / -1; background: var(--glass); border-radius: 24px; border: 1px solid rgba(59, 130, 246, 0.3); padding: 20px; margin-top: 10px; }
        .video-wrapper { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; max-height: 450px; display: flex; justify-content: center; }
        .video-wrapper video { width: 100%; height: auto; max-height: 450px; object-fit: cover; }

        /* ADMİN ALANI */
        .admin-section { grid-column: 1 / -1; background: var(--glass); border: 2px solid #ef4444; border-radius: 24px; padding: 25px; margin-top: 15px; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 15px; }
        .admin-card { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .admin-playlist-scroller { max-height: 180px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
        .admin-track-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; margin-bottom: 6px; font-size: 0.8rem; }
        .admin-track-info { cursor: pointer; color: #fff; flex-grow: 1; }
        .admin-track-item.active .admin-track-info { color: var(--accent); font-weight: bold; }
        .admin-del-btn { background: #ef4444; color: white; border: none; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; cursor: pointer; }

        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #1e293b; background: #070a12; color: white; }
        .btn { padding: 12px; border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; text-transform: uppercase; }
        .btn-danger { background: #ef4444; }
    </style>
</head>
<body>

    <div class="strobe-bg-effect"></div>
    <div id="ambient-container" class="ambient-party-lights">
        <div class="spot spot-1"></div><div class="spot spot-2"></div><div class="spot spot-3"></div>
    </div>

    <div style="position: absolute; top: -9999px; left: -9999px; opacity: 0; pointer-events: none;">
        <div id="hidden-music-engine"></div>
    </div>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="image_a2cd46.png" onerror="this.src='logo.png'">
            <h2 id="auth-title" style="margin-bottom:20px; font-family:'Orbitron'; color:var(--accent);">EĞLENCE ODASI</h2>
            <input type="text" id="fun-user-in" placeholder="Kullanıcı Adı">
            <input type="password" id="fun-pass-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleFunAuth()">GİRİŞ YAP</button>
            <p style="margin-top:10px; font-size:0.8rem; cursor:pointer; color:var(--accent);" onclick="toggleFunAuthMode()">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>

    <div class="main-layout">
        <div class="fun-header">
            <div class="logo-section"><img src="image_a2cd46.png" onerror="this.src='logo.png'"><span>İMAN POWER DISCO</span></div>
            <button class="btn btn-danger" style="width:auto; padding:8px 16px; font-size:0.75rem;" onclick="document.getElementById('admin-lock-box').style.display='block'">YÖNETİCİ</button>
        </div>

        <div class="music-panel">
            <div class="panel-title">🎵 CANLI YAYIN SESİ</div>
            <div class="now-playing-box">
                <div id="now-playing-title" style="font-weight:800; color:#fff; font-size:1.2rem; margin-bottom: 20px;">Müzik Bekleniyor... 🎧</div>
                <button id="force-play-btn" class="force-play-btn" onclick="forcePlayMusic()">🔊 ŞARKIYI BAŞLAT</button>
                <p style="font-size: 0.7rem; color: #94a3b8; margin-top: 15px;">Ses gelmiyorsa üstteki yeşil butona tıkla!</p>
            </div>
        </div>

        <div class="center-stage">
            <div class="panel-title" style="width: 100%; margin-bottom: 20px;">💬 KUDURTUCU SÖZÜMÜZ</div>
            <div id="live-troll-text" class="troll-text">YÜKLENİYOR... 😎</div>
            <div style="width: 120px; height: 120px; margin-top: 15px;"><img src="https://media.tenor.com/Zuo6pA_wE78AAAAi/cat-dance.gif" style="width:100%; height:100%; object-fit:contain;"></div>
        </div>

        <div class="video-box-container">
            <div class="panel-title" style="color:#3b82f6; margin-bottom:15px;">📺 AURA FC CANLI AKIŞ</div>
            <div class="video-wrapper">
                <video id="github-video" autoplay loop muted playsinline>
                    <source src="istockphoto-1629110917-640_adpp_is (1).mp4" type="video/mp4">
                    Tarayıcınız video etiketini desteklemiyor.
                </video>
            </div>
        </div>

        <div id="admin-lock-box" style="display:none; grid-column:1/-1; max-width:400px; margin:0 auto; width:100%; border:2px solid #ef4444; background:var(--glass); padding:20px; border-radius:16px;">
            <h4 style="font-family:'Orbitron'; margin-bottom:12px; color:#ef4444;">ADMİN ŞİFRE</h4>
            <input type="password" id="admin-password-field" placeholder="Admin Şifresi">
            <div style="display:flex; gap:10px;">
                <button class="btn" style="background:#ef4444;" onclick="verifyAdminKey()">GİRİŞ</button>
                <button class="btn" style="background:#64748b;" onclick="document.getElementById('admin-lock-box').style.display='none'">KAPAT</button>
            </div>
        </div>

        <div id="super-admin-panel" class="admin-section" style="display:none;">
            <h3 style="font-family:'Orbitron'; color:#ef4444; border-bottom:1px solid rgba(239,68,68,0.2); padding-bottom:10px;">🛠️ YÖNETİM PANELİ</h3>
            <div class="admin-grid">
                <div class="admin-card">
                    <h4 style="color:var(--accent); margin-bottom:10px;">💡 Işıklar & Kudurtucu Söz</h4>
                    <input type="text" id="adm-troll-input" placeholder="Yeni Kudurtucu Sözü Yaz">
                    <select id="adm-light-toggle"><option value="on">Işıklar Açık</option><option value="off">Işıklar Kapalı</option></select>
                    <button class="btn" style="background:#ef4444;" onclick="updateVisualSettings()">YAYINLA</button>
                </div>
                <div class="admin-card">
                    <h4 style="color:var(--accent); margin-bottom:10px;">🗂️ Şarkı Yönetim Masası (YouTube)</h4>
                    <div class="admin-playlist-scroller" id="admin-live-tracks-container"></div>
                    <button class="btn btn-danger" style="padding:6px; font-size:0.75rem; margin-bottom:15px;" onclick="clearAllSongs()">LİSTEYİ SIFIRLA</button>

                    <input type="text" id="adm-song-title" placeholder="Şarkı Adı">
                    <input type="text" id="adm-song-id" placeholder="YouTube Video ID veya Linki">
                    <button class="btn" onclick="addNewSongToDatabase()">LİSTEYE EKLE & ÇAL</button>

                    <div style="margin-top:15px; border-top:1px solid rgba(255,255,255,0.08); padding-top:10px;">
                        <label style="font-size:0.75rem; color:#10b981; display:block; margin-bottom:5px;">🔊 MERKEZİ SES SEVİYESİ</label>
                        <input type="range" id="admin-global-volume" min="0" max="100" value="100" onchange="updateGlobalVolumeFromAdmin(this.value)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // GÜNCEL KARTALHABER FIREBASE AYARLARIN (TAMAMEN KORUNDU)
        const firebaseConfig = {
            apiKey: "AIzaSyDebenlp7KcVZ2oE90iEHTTl2oEuGFVGKs",
            authDomain: "kartalhaber-49ae6.firebaseapp.com",
            databaseURL: "https://kartalhaber-49ae6-default-rtdb.firebaseio.com",
            projectId: "kartalhaber-49ae6",
            storageBucket: "kartalhaber-49ae6.firebasestorage.app",
            messagingSenderId: "804745909398",
            appId: "1:804745909398:web:d4ecaf7174886bbe835eb7",
            measurementId: "G-TV8NLXQTNP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let isRegisterMode = false;
        let musicPlayer = null;
        let currentActiveSongId = "";
        let globalVolumeSetting = 100;
        let isYTApiReady = false;

        window.onYouTubeIframeAPIReady = () => { isYTApiReady = true; };

        window.toggleFunAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "KAYIT OL" : "GİRİŞ YAP";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "KAYIT" : "GİRİŞ";
        };

        window.handleFunAuth = () => {
            const username = document.getElementById('fun-user-in').value.trim().toLowerCase();
            const password = document.getElementById('fun-pass-in').value;
            if(!username || !password) return alert("Boş bırakma!");

            if(isRegisterMode) {
                set(ref(db, 'fun_users/' + username), { password: password }).then(() => { alert("Kayıt tamam!"); toggleFunAuthMode(); });
            } else {
                onValue(ref(db, 'fun_users/' + username), (snap) => {
                    if(snap.exists() && snap.val().password === password) { 
                        document.getElementById('auth-screen').style.display = 'none'; 
                        buildPlayersSystem(); 
                    } else { alert("Hatalı giriş!"); }
                }, { onlyOnce: true });
            }
        };

        window.verifyAdminKey = () => {
            if(document.getElementById('admin-password-field').value === "imanpoweradmini31") {
                document.getElementById('admin-lock-box').style.display = 'none';
                document.getElementById('super-admin-panel').style.display = 'block';
            } else { alert("Şifre yanlış!"); }
        };

        window.updateVisualSettings = () => {
            set(ref(db, 'fun_settings/trollText'), document.getElementById('adm-troll-input').value.trim() || "İman Power!");
            set(ref(db, 'fun_settings/lightsStatus'), document.getElementById('adm-light-toggle').value);
        };

        function extractYTId(url) {
            if(url.length === 11) return url;
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        window.addNewSongToDatabase = () => {
            const title = document.getElementById('adm-song-title').value.trim();
            const id = document.getElementById('adm-song-id').value.trim();
            if(title && id) {
                push(ref(db, 'fun_songs'), { title, youtubeId: extractYTId(id) });
                document.getElementById('adm-song-title').value = ""; document.getElementById('adm-song-id').value = "";
            }
        };

        window.setLiveTrack = (key, id, title) => { set(ref(db, 'fun_current_track'), { songKey: key, youtubeId: id, title: title }); };
        window.delSong = (key) => { remove(ref(db, 'fun_songs/' + key)); };
        window.clearAllSongs = () => { if(confirm("Emin misin?")) remove(ref(db, 'fun_songs')); };
        window.updateGlobalVolumeFromAdmin = (val) => { set(ref(db, 'fun_settings/globalVolume'), parseInt(val)); };

        window.forcePlayMusic = () => {
            if(musicPlayer && typeof musicPlayer.playVideo === 'function') {
                musicPlayer.unMute();
                musicPlayer.setVolume(globalVolumeSetting);
                musicPlayer.playVideo();
                const btn = document.getElementById('force-play-btn');
                btn.innerText = "🔊 SES AKTİF (ÇALIYOR)";
                btn.style.animation = "none";
                btn.style.background = "#3b82f6";
            }
        };

        function buildPlayersSystem() {
            if(!isYTApiReady) return setTimeout(buildPlayersSystem, 300);

            musicPlayer = new YT.Player('hidden-music-engine', {
                height: '200', width: '200', videoId: currentActiveSongId || 'EY07kVGs_Jk',
                playerVars: { 'autoplay': 1, 'controls': 0 },
                events: {
                    'onReady': (e) => { e.target.setVolume(globalVolumeSetting); e.target.playVideo(); },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.ENDED) e.target.playVideo();
                        if (e.data === YT.PlayerState.PLAYING) {
                            document.getElementById('force-play-btn').innerText = "🔊 SES AKTİF (ÇALIYOR)";
                            document.getElementById('force-play-btn').style.animation = "none";
                            document.getElementById('force-play-btn').style.background = "#3b82f6";
                        }
                    }
                }
            });
        }

        onValue(ref(db, '/'), (snap) => {
            const data = snap.val() || {};
            const settings = data.fun_settings || {};

            // Kudurtucu Söz Buraya Çakılıyor
            document.getElementById('live-troll-text').innerText = settings.trollText || "İman Power!";
            
            const strobe = document.querySelector('.strobe-bg-effect');
            if(settings.lightsStatus === 'off') { if(strobe) strobe.style.display = 'none'; } 
            else { if(strobe) strobe.style.display = 'block'; }

            if(settings.globalVolume !== undefined) {
                globalVolumeSetting = settings.globalVolume;
                if(musicPlayer && typeof musicPlayer.setVolume === 'function') musicPlayer.setVolume(globalVolumeSetting);
                const slider = document.getElementById('admin-global-volume'); if(slider) slider.value = globalVolumeSetting;
            }

            if(data.fun_current_track) {
                const targetId = data.fun_current_track.youtubeId;
                document.getElementById('now-playing-title').innerText = "🎵 " + data.fun_current_track.title;
                if(targetId !== currentActiveSongId) {
                    currentActiveSongId = targetId;
                    if(musicPlayer && typeof musicPlayer.loadVideoById === 'function') {
                        musicPlayer.loadVideoById({ videoId: targetId });
                        const btn = document.getElementById('force-play-btn');
                        btn.innerText = "🔊 ŞARKIYI BAŞLAT";
                        btn.style.animation = "pulseBtnGlow 1.5s infinite";
                        btn.style.background = "#10b981";
                    }
                }
            }

            const adminContainer = document.getElementById('admin-live-tracks-container');
            if(adminContainer) {
                adminContainer.innerHTML = "";
                if(data.fun_songs) {
                    Object.entries(data.fun_songs).forEach(([k, v]) => {
                        const isPlaying = data.fun_current_track && data.fun_current_track.songKey === k;
                        adminContainer.innerHTML += `
                            <div class="admin-track-item ${isPlaying ? 'active' : ''}">
                                <div class="admin-track-info" onclick="setLiveTrack('${k}', '${v.youtubeId}', '${v.title}')">🎵 ${v.title} ${isPlaying ? '🔥' : ''}</div>
                                <button class="admin-del-btn" onclick="delSong('${k}')">X</button>
                            </div>`;
                    });
                }
            }
        });
    </script>
</body>
</html>
