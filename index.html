<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power | Disco</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #02040a;
            --glass: rgba(10, 15, 30, 0.9);
            --accent: #10b981;
            --text: #f3f4f6;
            --border: rgba(16, 185, 129, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

        /* ARKA PLAN DISCO FLAŞÖRÜ */
        .strobe-bg { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0; animation: flash 1.5s steps(1, end) infinite; }
        @keyframes flash {
            0%, 100% { opacity: 0; }
            15% { opacity: 0.15; background: #ff0055; filter: blur(40px); }
            45% { opacity: 0.15; background: #00ffcc; filter: blur(40px); }
            75% { opacity: 0.15; background: #9900ff; filter: blur(40px); }
        }

        /* GİRİŞ EKRANI */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--glass); padding: 40px; border-radius: 24px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        .auth-card img { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 20px; }

        /* ANA AYRAÇ */
        .main-layout { position: relative; z-index: 5; max-width: 1200px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .main-layout { grid-template-columns: 300px 1fr; } }

        .header-area { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 15px 20px; border-radius: 16px; border: 1px solid var(--border); }
        .logo-box { display: flex; align-items: center; gap: 10px; font-family: 'Orbitron'; font-weight: 900; color: var(--accent); }
        .logo-box img { width: 40px; height: 40px; border-radius: 50%; }

        /* SOL PANEL: SADECE ÇALAN ŞARKI VE SES AYARI */
        .left-panel { background: var(--glass); border-radius: 20px; border: 1px solid var(--border); padding: 20px; height: fit-content; display: flex; flex-direction: column; gap: 15px; }
        .panel-title { font-family: 'Orbitron'; font-size: 0.9rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .playing-now { background: rgba(16, 185, 129, 0.08); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--border); font-weight: 800; font-size: 0.9rem; color: #fff; }

        /* ORTA PANEL: KUDURTUCU SÖZ VE KEDİ */
        .center-panel { background: var(--glass); border-radius: 20px; border: 1px solid var(--border); padding: 40px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .troll-text { font-family: 'Orbitron'; font-size: 2rem; font-weight: 900; color: #f43f5e; text-shadow: 0 0 15px rgba(244, 63, 94, 0.6); margin-bottom: 25px; animation: bounce 0.6s infinite alternate; text-transform: uppercase; }
        @keyframes bounce { from { transform: scale(0.95); } to { transform: scale(1.05); } }
        .cat-box { width: 160px; height: 160px; }
        .cat-box img { width: 100%; height: 100%; object-fit: contain; }

        /* EN ALT PANEL: ADMİN MASASI */
        .admin-panel { grid-column: 1 / -1; background: var(--glass); border: 2px solid #ef4444; border-radius: 20px; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 15px; }
        .admin-card { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .admin-scroll { max-height: 120px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; margin-bottom: 10px; }
        .track-item { display: flex; justify-content: space-between; align-items: center; padding: 6px; background: rgba(255,255,255,0.02); margin-bottom: 4px; border-radius: 6px; font-size: 0.8rem; }
        .track-click { cursor: pointer; flex-grow: 1; }
        .track-item.active .track-click { color: var(--accent); font-weight: bold; }

        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #1e293b; background: #070a12; color: white; }
        .btn { padding: 10px; border: none; border-radius: 8px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; text-transform: uppercase; }
        .btn-danger { background: #ef4444; }
    </style>
</head>
<body onclick="startAudioOnInteraction()">

    <div class="strobe-bg"></div>

    <audio id="main-audio-player" loop style="display:none;"></audio>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="image_a2cd46.png" alt="Logo" onerror="this.src='logo.png'">
            <h2 id="auth-title" style="margin-bottom:15px; font-family:'Orbitron'; color:var(--accent);">DISCO GİRİŞİ</h2>
            <input type="text" id="fun-user-in" placeholder="Kullanıcı Adı">
            <input type="password" id="fun-pass-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleFunAuth()">GİRİŞ YAP</button>
            <p id="toggle-text" style="margin-top:10px; font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="toggleFunAuthMode()">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>

    <div class="main-layout">
        
        <div class="header-area">
            <div class="logo-box">
                <img src="image_a2cd46.png" onerror="this.src='logo.png'">
                <span>İMAN POWER DISCO</span>
            </div>
            <button class="btn btn-danger" style="width:auto; padding:6px 12px; font-size:0.75rem;" onclick="document.getElementById('admin-lock').style.display='block'">YÖNETİCİ GİRİŞİ</button>
        </div>

        <div class="left-panel">
            <div class="panel-title">📻 CANLI YAYIN SESİ</div>
            <div class="playing-now" id="now-playing-title">Müzik Bekleniyor... 🎧</div>
            
            <div>
                <label style="font-size:0.7rem; color:var(--accent); display:block; margin-bottom:5px; font-family:'Orbitron';">KİŞİSEL SES SEVİYESİ</label>
                <input type="range" id="volume-slider" min="0" max="100" value="60" oninput="setAudioVolume(this.value)" style="accent-color:#10b981; width:100%;">
            </div>
        </div>

        <div class="center-panel">
            <div id="live-troll-text" class="troll-text">YÜKLENİYOR... 😎</div>
            <div class="cat-box">
                <img src="https://media.tenor.com/Zuo6pA_wE78AAAAi/cat-dance.gif" alt="Dancing Cat">
            </div>
        </div>

        <div id="admin-lock" style="display:none; grid-column:1/-1; max-width:350px; margin:0 auto; width:100%; border:2px solid #ef4444; background:var(--glass); padding:15px; border-radius:12px;">
            <h5 style="font-family:'Orbitron'; margin-bottom:10px; color:#ef4444;">ADMİN ŞİFRESİ</h5>
            <input type="password" id="admin-pass" placeholder="Şifre">
            <div style="display:flex; gap:5px;">
                <button class="btn" style="background:#ef4444;" onclick="checkAdminKey()">GİRİŞ</button>
                <button class="btn" style="background:#64748b;" onclick="document.getElementById('admin-lock').style.display='none'">KAPAT</button>
            </div>
        </div>

        <div id="super-admin-panel" class="admin-panel" style="display:none;">
            <h4 style="font-family:'Orbitron'; color:#ef4444; border-bottom:1px solid rgba(239,68,68,0.2); padding-bottom:5px;">🛠️ EĞLENCE MASASI YÖNETİMİ</h4>
            <div class="admin-grid">
                
                <div class="admin-card">
                    <h5 style="color:var(--accent); margin-bottom:8px;">💡 Sahnede Ne Yazsın?</h5>
                    <input type="text" id="adm-troll-input" placeholder="Kudurtucu Sözü Yaz">
                    <select id="adm-light-toggle">
                        <option value="on">Işıklar Açık</option>
                        <option value="off">Işıkları Kapat</option>
                    </select>
                    <button class="btn" style="background:#ef4444;" onclick="saveVisuals()">GÜNCELLE</button>
                </div>

                <div class="admin-card">
                    <h5 style="color:var(--accent); margin-bottom:8px;">🎵 Şarkıları Yönet & Çal</h5>
                    <div class="admin-scroll" id="admin-tracks-list"></div>
                    <button class="btn btn-danger" style="padding:4px; font-size:0.7rem; margin-bottom:10px;" onclick="clearSongs()">LİSTEYİ SIFIRLA</button>
                    
                    <input type="text" id="adm-title" placeholder="Şarkı Adı">
                    <input type="text" id="adm-url" placeholder="Ses Dosyası / .mp3 Linki">
                    <button class="btn" onclick="addSong()">LİSTEYE EKLE</button>
                </div>

            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDebenlp7KcVZ2oE90iEHTTl2oEuGFVGKs",
            authDomain: "kartalhaber-49ae6.firebaseapp.com",
            databaseURL: "https://kartalhaber-49ae6-default-rtdb.firebaseio.com", 
            projectId: "kartalhaber-49ae6",
            storageBucket: "kartalhaber-49ae6.firebasestorage.app",
            messagingSenderId: "840474590939",
            appId: "1:840474590939:web:d4ecaf7174886bbe835eb7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let userLoggedIn = false;
        let isRegisterMode = false;
        let audioPlayer = document.getElementById('main-audio-player');
        let currentTrackUrl = "";
        let currentVolume = 60;

        window.toggleFunAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "DISCO KAYIT" : "DISCO GİRİŞİ";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "KAYIT OL" : "GİRİŞ YAP";
        };

        window.handleFunAuth = () => {
            const user = document.getElementById('fun-user-in').value.trim().toLowerCase();
            const pass = document.getElementById('fun-pass-in').value;
            if(!user || !pass) return alert("Boş bırakma başkan!");

            if(isRegisterMode) {
                set(ref(db, 'fun_users/' + user), { password: pass }).then(() => {
                    alert("Kayıt tamam! Giriş yapabilirsin."); toggleFunAuthMode();
                });
            } else {
                onValue(ref(db, 'fun_users/' + user), (snap) => {
                    if(snap.exists() && snap.val().password === pass) {
                        userLoggedIn = true;
                        document.getElementById('auth-screen').style.display = 'none';
                        if(currentTrackUrl) playTrack(currentTrackUrl);
                    } else { alert("Hatalı kullanıcı veya şifre!"); }
                }, { onlyOnce: true });
            }
        };

        window.checkAdminKey = () => {
            if(document.getElementById('admin-pass').value === "imanpoweradmini31") {
                document.getElementById('admin-lock').style.display = 'none';
                document.getElementById('super-admin-panel').style.display = 'block';
                alert("Giriş Başarılı!");
            } else { alert("Şifre yanlış!"); }
        };

        window.saveVisuals = () => {
            const t = document.getElementById('adm-troll-input').value.trim();
            const l = document.getElementById('adm-light-toggle').value;
            set(ref(db, 'fun_settings/trollText'), t || "İMAN POWER DISCO!");
            set(ref(db, 'fun_settings/lightsStatus'), l);
            alert("Yayınlandı!");
        };

        window.addSong = () => {
            const title = document.getElementById('adm-title').value.trim();
            const url = document.getElementById('adm-url').value.trim();
            if(title && url) {
                push(ref(db, 'fun_songs'), { title, url });
                document.getElementById('adm-title').value = "";
                document.getElementById('adm-url').value = "";
            }
        };

        window.broadcastTrack = (key, url, title) => {
            set(ref(db, 'fun_current_track'), { songKey: key, url: url, title: title });
        };

        window.deleteSong = (key) => { remove(ref(db, 'fun_songs/' + key)); };
        window.clearSongs = () => { if(confirm("Temizlensin mi?")) remove(ref(db, 'fun_songs')); };

        window.setAudioVolume = (val) => {
            currentVolume = parseInt(val);
            if(audioPlayer) audioPlayer.volume = currentVolume / 100;
        };

        window.startAudioOnInteraction = () => {
            if(audioPlayer && audioPlayer.paused && currentTrackUrl && userLoggedIn) {
                audioPlayer.play().catch(e => {});
            }
        };

        function playTrack(url) {
            if(!audioPlayer) return;
            audioPlayer.pause();
            audioPlayer.src = url;
            audioPlayer.volume = currentVolume / 100;
            if(userLoggedIn) {
                audioPlayer.play().catch(e => console.log("İlk tıklama bekleniyor..."));
            }
        }

        // VERİ TABANI KANALI DİNLEME
        onValue(ref(db, '/'), (snap) => {
            const data = snap.val() || {};
            const settings = data.fun_settings || {};

            // Söz Senkronu
            document.getElementById('live-troll-text').innerText = settings.trollText || "İMAN POWER DISCO! 😎";

            // Işık Kontrolü
            const strobe = document.querySelector('.strobe-bg');
            if(settings.lightsStatus === 'off') { if(strobe) strobe.style.display = 'none'; }
            else { if(strobe) strobe.style.display = 'block'; }

            // Çalan Şarkı Senkronu
            if(data.fun_current_track) {
                document.getElementById('now-playing-title').innerText = "🎵 " + (data.fun_current_track.title || "Şarkı");
                const targetUrl = data.fun_current_track.url;
                if(targetUrl !== currentTrackUrl) {
                    currentTrackUrl = targetUrl;
                    playTrack(targetUrl);
                }
            }

            // Admin Paneli Şarkı Listesi OLUŞTURUCU
            const adminContainer = document.getElementById('admin-tracks-list');
            if(adminContainer) {
                adminContainer.innerHTML = "";
                if(data.fun_songs) {
                    Object.entries(data.fun_songs).forEach(([k, v]) => {
                        const isPlaying = data.fun_current_track && data.fun_current_track.songKey === k;
                        adminContainer.innerHTML += `
                            <div class="track-item ${isPlaying ? 'active' : ''}">
                                <div class="track-click" onclick="broadcastTrack('${k}', '${v.url}', '${v.title}')">
                                    🎵 ${v.title} ${isPlaying ? '🔥' : ''}
                                </div>
                                <button style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer;" onclick="deleteSong('${k}')">X</button>
                            </div>`;
                    });
                } else {
                    adminContainer.innerHTML = `<div style="color:#64748b; font-size:0.75rem; text-align:center;">Liste boş.</div>`;
                }
            }
        });
    </script>
</body>
</html>
