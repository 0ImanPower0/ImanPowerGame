<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power | Cyber Disco V6 (Kesin Çalışan)</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --bg: #020006;
            --glass: rgba(8, 2, 18, 0.88);
            --accent: #ff0055;
            --accent-glow: rgba(255, 0, 85, 0.5);
            --neon-blue: #00f0ff;
            --neon-purple: #9d00ff;
            --text: #f3f4f6;
            --border: rgba(255, 0, 85, 0.35);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; position: relative;
        }

        /* DISCO IŞIKLARI */
        .strobe-bg-effect { position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0; animation: strobeFlash 0.6s steps(1, end) infinite; }
        @keyframes strobeFlash { 0%, 100% { opacity: 0; } 15% { opacity: 0.25; background: var(--accent); filter: blur(50px); } 55% { opacity: 0.3; background: var(--neon-blue); filter: blur(70px); } }

        .ambient-party-lights { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .spot { position: absolute; width: 450px; height: 450px; border-radius: 50%; filter: blur(140px); opacity: 0.5; animation: pulseSpot 4s ease-in-out infinite alternate; }
        .spot-1 { top: -100px; left: -50px; background: var(--accent); }
        .spot-2 { bottom: -100px; right: -50px; background: var(--neon-blue); animation-delay: 1s; }

        @keyframes pulseSpot { 0% { transform: scale(0.8); opacity: 0.3; } 100% { transform: scale(1.3) translate(40px, 40px); opacity: 0.7; } }

        /* GİRİŞ PANELİ */
        #auth-screen { position: fixed; inset: 0; background: #010003; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: var(--glass); padding: 45px; border-radius: 30px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 420px; box-shadow: 0 0 50px var(--accent-glow); backdrop-filter: blur(25px); position: relative; z-index: 10001; }
        .auth-card img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 25px; object-fit: cover; }

        /* ANA LAYOUT */
        .main-layout { position: relative; z-index: 5; max-width: 1450px; margin: 0 auto; padding: 25px; display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media (min-width: 992px) { .main-layout { grid-template-columns: 360px 1fr; } }

        /* ÜST BAR */
        .fun-header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 18px 30px; border-radius: 24px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .logo-section { display: flex; align-items: center; gap: 15px; font-family: 'Orbitron'; font-weight: 900; color: #fff; font-size: 1.3rem; text-shadow: 0 0 15px var(--accent); }
        .logo-section img { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--accent); }

        /* MÜZİK ALANI */
        .left-sidebar { display: flex; flex-direction: column; gap: 25px; }
        .music-panel { background: var(--glass); border-radius: 24px; border: 1px solid var(--border); padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel-title { font-family: 'Orbitron'; font-weight: 700; color: var(--neon-blue); border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 15px; text-shadow: 0 0 10px var(--neon-blue); }
        .now-playing-box { background: rgba(255, 0, 85, 0.12); border: 1px solid var(--border); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 15px; }
        
        .join-audio-btn { width: 100%; background: #00ff66; color: #000; font-weight: 900; font-family: 'Orbitron'; padding: 15px; border: none; border-radius: 12px; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,102,0.4); transition: 0.2s; animation: pulseBtn 1.5s infinite alternate; }
        .join-audio-btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        @keyframes pulseBtn { from { box-shadow: 0 0 10px rgba(0,255,102,0.3); } to { box-shadow: 0 0 30px rgba(0,255,102,0.8); } }

        /* KUDURTUCU MERKEZ */
        .center-stage { background: var(--glass); border-radius: 24px; border: 1px solid var(--border); padding: 45px 25px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 240px; text-align: center; }
        .troll-text { font-family: 'Orbitron'; font-size: 2.6rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--accent), 0 0 30px var(--accent); margin-bottom: 25px; animation: pulseText 0.4s infinite alternate; }
        @keyframes pulseText { from { transform: scale(0.96); } to { transform: scale(1.04); } }
        .cat-box { width: 130px; height: 130px; filter: drop-shadow(0 0 15px var(--neon-purple)); }
        .cat-box img { width: 100%; height: 100%; object-fit: contain; }

        /* DOKUNULMAZ VİDEO DUVARI */
        .video-box-container { background: var(--glass); border-radius: 24px; border: 1px solid rgba(0, 240, 255, 0.4); padding: 25px; }
        .video-wrapper { position: relative; width: 100%; border-radius: 16px; overflow: hidden; background: #000; min-height: 420px; }
        
        /* Sihirli Kalkan */
        .video-protection-shield { position: absolute; inset: 0; z-index: 10; background: transparent; pointer-events: auto; }
        .iframe-container { width: 100%; height: 100%; min-height: 420px; pointer-events: none; }

        /* FORMLAR & BUTONLAR */
        input, select { width: 100%; padding: 14px; margin-bottom: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: #0a0416; color: white; }
        .btn { padding: 14px; border: none; border-radius: 12px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; transition: 0.2s; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 20px var(--accent-glow); }
        .btn-danger { background: #ef4444; }

        /* ADMİN MASASI */
        .admin-section { grid-column: 1 / -1; background: rgba(12, 2, 22, 0.98); border: 2px solid var(--accent); border-radius: 28px; padding: 30px; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; margin-top: 20px; }
        .admin-card { background: rgba(0,0,0,0.5); padding: 22px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.07); }
        .admin-playlist-scroller { max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 14px; margin-bottom: 12px; }
        .admin-track-item { display: flex; justify-content: space-between; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
        .admin-track-info { cursor: pointer; color: #fff; transition: 0.2s; flex-grow: 1; }
        .admin-track-info:hover { color: var(--accent); font-weight: bold; }

        /* ZORUNLU GÜVENLİK ALANI: Ses çaları gizliyoruz ama YOK ETMİYORUZ. Tarayıcı kandırmacası. */
        .audio-stealth-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 200px; height: 200px; opacity: 0.001; z-index: -999; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="strobe-bg-effect"></div>
    <div id="ambient-container" class="ambient-party-lights">
        <div class="spot spot-1"></div><div class="spot spot-2"></div>
    </div>

    <!-- SES MOTORU: 200x200 boyutunda, ekranın ortasında ama neredeyse %100 şeffaf -->
    <div class="audio-stealth-box">
        <div id="hidden-audio-player"></div>
    </div>

    <!-- GİRİŞ PANELİ -->
    <div id="auth-screen">
        <div class="auth-card">
            <img src="image_a2cd46.png" onerror="this.src='logo.png'">
            <h2 id="auth-title" style="margin-bottom:25px; font-family:'Orbitron'; color:var(--accent);">CYBER DISCO</h2>
            <input type="text" id="fun-user-in" placeholder="Kullanıcı Adı">
            <input type="password" id="fun-pass-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleFunAuth()">SALONA GİRİŞ YAP</button>
            <p style="margin-top:15px; font-size:0.9rem; cursor:pointer; color:var(--neon-blue);" onclick="toggleFunAuthMode()">Hesabın yok mu? Kayıt Ol</p>
        </div>
    </div>

    <!-- ANA EKRAN -->
    <div class="main-layout">
        <div class="fun-header">
            <div class="logo-section"><img src="image_a2cd46.png" onerror="this.src='logo.png'"> İMAN POWER</div>
            <button class="btn btn-danger" style="width:auto; padding:10px 20px;" onclick="toggleAdminPrompt()">ADMİN MASASI</button>
        </div>

        <div class="left-sidebar">
            <div class="music-panel">
                <div class="panel-title">🎵 MERKEZİ SES</div>
                <div class="now-playing-box">
                    <div id="now-playing-title" style="font-weight:800; font-size:1rem;">Kaptan Şarkı Seçiyor... 🎧</div>
                </div>
                <button class="join-audio-btn" onclick="unlockAudioContext()">🎧 MÜZİĞİ SENKRONİZE ET</button>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 25px;">
            <div class="center-stage">
                <div id="live-troll-text" class="troll-text">DISCO BAŞLIYOR... 🔥</div>
                <div class="cat-box"><img src="https://media.tenor.com/Zuo6pA_wE78AAAAi/cat-dance.gif"></div>
            </div>

            <!-- VİDEO DUVARI -->
            <div class="video-box-container">
                <div class="panel-title">📺 ARKA PLAN VİDEOSU</div>
                <div class="video-wrapper">
                    <!-- Sihirli Kalkan -->
                    <div class="video-protection-shield"></div>
                    <div class="iframe-container" id="visual-video-player"></div>
                </div>
            </div>
        </div>

        <!-- ADMİN KISIMLARI -->
        <div id="admin-lock-box" style="display:none; grid-column:1/-1; max-width:400px; margin:0 auto; background:var(--glass); padding:25px; border-radius:20px; border:2px solid var(--accent);">
            <h4 style="color:var(--accent); text-align:center; margin-bottom:15px;">ŞİFRE DOĞRULAMA</h4>
            <input type="password" id="admin-password-field" placeholder="Admin Şifresi">
            <button class="btn" onclick="verifyAdminKey()">GİRİŞ</button>
        </div>

        <div id="super-admin-panel" class="admin-section" style="display:none;">
            <h3 style="color:var(--accent); margin-bottom:20px;">🛠️ KONTROL MASASI</h3>
            <div class="admin-grid">
                <div class="admin-card">
                    <h4 style="color:var(--neon-blue);">💡 Söz & Işık</h4>
                    <input type="text" id="adm-troll-input" placeholder="Kudurtucu Cümle">
                    <select id="adm-light-toggle"><option value="on">Işıklar Açık</option><option value="off">Kapat</option></select>
                    <button class="btn" onclick="updateVisualSettings()">ATEŞLE</button>
                </div>

                <div class="admin-card">
                    <h4 style="color:var(--accent);">🎬 Video Değiştir</h4>
                    <input type="text" id="adm-video-link-input" placeholder="YouTube Video ID/Link">
                    <button class="btn" style="background:var(--neon-blue); color:#000;" onclick="updateAuraMediaLink()">VİDEOYU YANSIT</button>
                </div>

                <div class="admin-card">
                    <h4 style="color:var(--neon-blue);">🗂️ Şarkı Yönetimi</h4>
                    <div class="admin-playlist-scroller" id="admin-live-tracks-container"></div>
                    <input type="text" id="adm-song-title" placeholder="Şarkı Adı">
                    <input type="text" id="adm-song-id" placeholder="YouTube Video ID/Link">
                    <button class="btn" onclick="addNewSongToDatabase()">HAVUZA EKLE</button>

                    <div style="margin-top:20px;">
                        <label style="color:var(--accent); display:block; margin-bottom:8px;">🔊 ODA SES SEVİYESİ</label>
                        <input type="range" id="admin-global-volume" min="0" max="100" value="70" onchange="updateGlobalVolumeFromAdmin(this.value)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDy4ZUv_wZsntWSIDbcOlvpqDTBvWuSdrk",
            authDomain: "imanpowerveri.firebaseapp.com",
            databaseURL: "https://imanpowerveri-default-rtdb.firebaseio.com", 
            projectId: "imanpowerveri",
            storageBucket: "imanpowerveri.firebasestorage.app",
            messagingSenderId: "891464029314",
            appId: "1:891464029314:web:581bd3b2ed3d7c6af2d09b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = "";
        let isRegisterMode = false;
        
        let bgVideoPlayer = null;
        let audioPlayer = null;
        let isAudioContextUnlocked = false; // BU ÇOK ÖNEMLİ
        
        let currentActiveSongId = "dQw4w9WgXcQ"; // İlk kurulum için varsayılan bir şarkı şart
        let currentActiveVideoId = "EY07kVGs_Jk";
        let globalVolumeSetting = 70;

        window.onYouTubeIframeAPIReady = () => {
            // Görsel Video Oynatıcı (Zaten hep sessiz)
            bgVideoPlayer = new YT.Player('visual-video-player', {
                videoId: currentActiveVideoId,
                playerVars: { 'autoplay': 1, 'controls': 0, 'mute': 1, 'modestbranding': 1, 'rel': 0, 'disablekb': 1, 'loop': 1 },
                events: {
                    'onReady': (e) => { e.target.mute(); e.target.playVideo(); },
                    'onStateChange': (e) => { if (e.data === 0) e.target.playVideo(); } 
                }
            });

            // Ses Oynatıcı 
            audioPlayer = new YT.Player('hidden-audio-player', {
                videoId: currentActiveSongId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1 },
                events: {
                    'onStateChange': (e) => { if (e.data === 0) e.target.playVideo(); } 
                }
            });
        };

        // İŞTE SİHİR BURADA: Kullanıcı sayfaya dokunduğu an tarayıcının ses kilidini kırıyoruz
        window.unlockAudioContext = () => {
            if(!isAudioContextUnlocked && audioPlayer && typeof audioPlayer.playVideo === 'function') {
                audioPlayer.unMute();
                audioPlayer.setVolume(globalVolumeSetting);
                audioPlayer.playVideo();
                isAudioContextUnlocked = true;
            }
        };

        // Her ihtimale karşı: Kullanıcı "Kullanıcı adı" kutusuna tıkladığında bile arka planda sesi çözer.
        document.body.addEventListener('click', () => { unlockAudioContext(); }, { once: true });
        document.body.addEventListener('touchstart', () => { unlockAudioContext(); }, { once: true });

        // GİRİŞ YAP BUTONU
        window.handleFunAuth = () => {
            unlockAudioContext(); // Garantiye almak için tekrar tetikleniyor

            const user = document.getElementById('fun-user-in').value.trim().toLowerCase();
            const pass = document.getElementById('fun-pass-in').value;
            if(!user || !pass) return alert("Boş bırakma!");

            if(isRegisterMode) {
                set(ref(db, 'fun_users/' + user), { password: pass }).then(() => { alert("Kayıt ok!"); toggleFunAuthMode(); });
            } else {
                onValue(ref(db, 'fun_users/' + user), (snap) => {
                    if(snap.exists() && snap.val().password === pass) { 
                        currentUser = user; 
                        document.getElementById('auth-screen').style.display = 'none'; 
                    } else { alert("Hatalı giriş!"); }
                }, { onlyOnce: true });
            }
        };

        window.toggleFunAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "KAYIT OL" : "CYBER DISCO";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "HESAP OLUŞTUR" : "GİRİŞ YAP";
        };

        // ADMIN KOMUTLARI (Aynı Kasıtlı Tutuldu)
        window.toggleAdminPrompt = () => { document.getElementById('admin-lock-box').style.display = 'block'; };
        window.verifyAdminKey = () => {
            if(document.getElementById('admin-password-field').value === "imanpoweradmini31") {
                document.getElementById('admin-lock-box').style.display = 'none';
                document.getElementById('super-admin-panel').style.display = 'block';
            } else { alert("Yanlış şifre!"); }
        };

        window.updateVisualSettings = () => {
            set(ref(db, 'fun_settings/trollText'), document.getElementById('adm-troll-input').value || "🔥 KOPUYORUZ 🔥");
            set(ref(db, 'fun_settings/lightsStatus'), document.getElementById('adm-light-toggle').value);
        };

        function parseYT(url) {
            const m = url.match(/^.*(youtu.be\/|v\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (m && m[2].length === 11) ? m[2] : (url.length === 11 ? url : null);
        }

        window.updateAuraMediaLink = () => {
            const id = parseYT(document.getElementById('adm-video-link-input').value);
            if(id) set(ref(db, 'fun_settings/videoData'), { sourceId: id });
        };

        window.addNewSongToDatabase = () => {
            const title = document.getElementById('adm-song-title').value;
            const id = parseYT(document.getElementById('adm-song-id').value);
            if(title && id) {
                push(ref(db, 'fun_songs'), { title, youtubeId: id });
                document.getElementById('adm-song-title').value = ""; document.getElementById('adm-song-id').value = "";
            }
        };

        window.setLiveTrack = (k, id, t) => { set(ref(db, 'fun_current_track'), { songKey: k, youtubeId: id, title: t }); };
        window.updateGlobalVolumeFromAdmin = (v) => { set(ref(db, 'fun_settings/globalVolume'), parseInt(v)); };

        // FIREBASE DİNLEYİCİSİ
        onValue(ref(db, '/'), (snap) => {
            const data = snap.val() || {};
            const set_data = data.fun_settings || {};

            document.getElementById('live-troll-text').innerText = set_data.trollText || "PARTİ ZAMANI!";
            document.querySelector('.strobe-bg-effect').style.display = set_data.lightsStatus === 'off' ? 'none' : 'block';

            if(set_data.globalVolume !== undefined) {
                globalVolumeSetting = set_data.globalVolume;
                if(audioPlayer && audioPlayer.setVolume) audioPlayer.setVolume(globalVolumeSetting);
                if(document.getElementById('admin-global-volume')) document.getElementById('admin-global-volume').value = globalVolumeSetting;
            }

            if(set_data.videoData && set_data.videoData.sourceId && set_data.videoData.sourceId !== currentActiveVideoId) {
                currentActiveVideoId = set_data.videoData.sourceId;
                if(bgVideoPlayer && bgVideoPlayer.loadVideoById) {
                    bgVideoPlayer.loadVideoById({ videoId: currentActiveVideoId });
                    bgVideoPlayer.mute(); 
                }
            }

            // Müzik Güncellemesi Gelirse
            if(data.fun_current_track && data.fun_current_track.youtubeId !== currentActiveSongId) {
                currentActiveSongId = data.fun_current_track.youtubeId;
                document.getElementById('now-playing-title').innerText = data.fun_current_track.title;
                
                if(audioPlayer && audioPlayer.loadVideoById) {
                    audioPlayer.loadVideoById({ videoId: currentActiveSongId });
                    // Eğer kullanıcı daha önce bir yere tıkladıysa, ses zateb hazırdır direkt çalar
                    if(isAudioContextUnlocked) {
                        audioPlayer.playVideo();
                    }
                }
            }

            const list = document.getElementById('admin-live-tracks-container');
            if(list) {
                list.innerHTML = "";
                if(data.fun_songs) {
                    Object.entries(data.fun_songs).forEach(([k, v]) => {
                        const active = data.fun_current_track && data.fun_current_track.songKey === k ? 'color:var(--accent); font-weight:bold;' : '';
                        list.innerHTML += `<div class="admin-track-item">
                            <div class="admin-track-info" style="${active}" onclick="setLiveTrack('${k}', '${v.youtubeId}', '${v.title}')">${v.title}</div>
                        </div>`;
                    });
                }
            }
        });
    </script>
</body>
</html>
