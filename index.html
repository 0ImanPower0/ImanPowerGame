<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İman Power | Eğlence Odası</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #02040a;
            --glass: rgba(10, 15, 30, 0.88);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
            --text: #f3f4f6;
            --border: rgba(16, 185, 129, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; position: relative; }

        /* ARKA PLAN IŞIK EFEKTLERİ */
        .ambient-party-lights { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
        .spot { position: absolute; width: 300px; height: 300px; border-radius: 50%; filter: blur(100px); opacity: 0.4; animation: pulseSpot 3s ease-in-out infinite alternate; }
        .spot-1 { top: -50px; left: 15%; background: #ef4444; }
        .spot-2 { bottom: 10%; right: 10%; background: #3b82f6; animation-delay: 0.5s; }
        @keyframes pulseSpot { 0% { transform: scale(0.8); } 100% { transform: scale(1.4); } }

        /* GİRİŞ EKRANI */
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .auth-card { background: var(--glass); padding: 40px; border-radius: 24px; border: 2px solid var(--accent); text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 40px var(--accent-glow); backdrop-filter: blur(12px); }
        .auth-card img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 20px; object-fit: cover; }

        /* ANA AYRAÇ */
        .main-layout { position: relative; z-index: 5; max-width: 1300px; margin: 0 auto; padding: 25px 20px; display: grid; grid-template-columns: 1fr; gap: 25px; }
        @media (min-width: 768px) { .main-layout { grid-template-columns: 1fr 1fr; } }

        .fun-header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 15px 25px; border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .logo-section { display: flex; align-items: center; gap: 12px; font-family: 'Orbitron'; font-weight: 900; color: var(--accent); }
        .logo-section img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); }

        /* SOL TARAF: MP3 SESTİ PANELİ */
        .music-panel { background: var(--glass); border-radius: 24px; border: 1px solid var(--border); padding: 25px; display: flex; flex-direction: column; gap: 15px; justify-content: center; }
        .panel-title { font-family: 'Orbitron'; font-size: 1rem; font-weight: 700; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .now-playing-box { background: rgba(16, 185, 129, 0.04); border: 1px solid var(--border); padding: 30px 15px; border-radius: 16px; text-align: center; }
        .force-play-btn { width: 100%; padding: 15px; font-weight: 900; font-family: 'Orbitron'; background: #10b981; border: none; border-radius: 10px; color: #fff; cursor: pointer; transition: 0.3s; font-size: 1.1rem; box-shadow: 0 0 15px var(--accent-glow); }

        /* SAĞ TARAF: KUDURTUCU SÖZÜ */
        .center-stage { background: var(--glass); border-radius: 24px; border: 1px solid var(--border); padding: 35px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center; }
        .troll-text { font-family: 'Orbitron'; font-size: 2rem; font-weight: 900; color: #f43f5e; animation: pulseText 0.8s infinite alternate; text-transform: uppercase; word-break: break-word; }
        @keyframes pulseText { from { transform: scale(0.95); } to { transform: scale(1.05); } }

        /* ALT TARAF: UPLOAD ETTİĞİNİZ GITHUB MP4 VİDEOSU */
        .video-box-container { grid-column: 1 / -1; background: var(--glass); border-radius: 24px; border: 1px solid rgba(59, 130, 246, 0.3); padding: 20px; }
        .video-wrapper { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; max-height: 400px; display: flex; justify-content: center; }
        .video-wrapper video { width: 100%; height: auto; max-height: 400px; object-fit: cover; }

        /* ADMİN */
        .admin-section { grid-column: 1 / -1; background: var(--glass); border: 2px solid #ef4444; border-radius: 24px; padding: 25px; }
        .admin-playlist-scroller { max-height: 150px; overflow-y: auto; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 12px; margin-bottom: 10px; }
        .admin-track-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: rgba(255,255,255,0.02); border-radius: 8px; margin-bottom: 5px; }
        .admin-track-info { cursor: pointer; color: #fff; flex-grow: 1; }
        .admin-track-item.active .admin-track-info { color: var(--accent); font-weight: bold; }

        input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #1e293b; background: #070a12; color: white; }
        .btn { padding: 12px; border: none; border-radius: 10px; color: white; font-weight: 800; cursor: pointer; background: var(--accent); width: 100%; text-transform: uppercase; }
        .btn-danger { background: #ef4444; }
    </style>
</head>
<body>

    <div id="ambient-container" class="ambient-party-lights">
        <div class="spot spot-1"></div><div class="spot spot-2"></div>
    </div>

    <audio id="imanpower-audio-engine" loop></audio>

    <div id="auth-screen">
        <div class="auth-card">
            <img src="image_2aa6c5.png" onerror="this.src='logo.png'">
            <h2 id="auth-title" style="margin-bottom:20px; font-family:'Orbitron'; color:var(--accent);">EĞLENCE ODASI</h2>
            <input type="text" id="fun-user-in" placeholder="Kullanıcı Adı">
            <input type="password" id="fun-pass-in" placeholder="Şifre">
            <button class="btn" id="auth-btn" onclick="handleFunAuth()">GİRİŞ YAP</button>
            <p style="margin-top:10px; font-size:0.8rem; cursor:pointer; color:var(--accent);" onclick="toggleFunAuthMode()">Kayıt Ol</p>
        </div>
    </div>

    <div class="main-layout">
        <div class="fun-header">
            <div class="logo-section"><img src="image_2aa6c5.png" onerror="this.src='logo.png'"><span>İMAN POWER DISCO</span></div>
            <button class="btn btn-danger" style="width:auto; padding:8px 16px;" onclick="document.getElementById('admin-lock-box').style.display='block'">YÖNETİCİ</button>
        </div>

        <div class="music-panel">
            <div class="panel-title">🎵 CANLI MP3 YAYIN AKIŞI</div>
            <div class="now-playing-box">
                <div id="now-playing-title" style="font-weight:800; color:#fff; font-size:1.2rem; margin-bottom:15px;">Müzik Yükleniyor... 🎧</div>
                <button id="force-play-btn" class="force-play-btn" onclick="forcePlayMusic()">🔊 SES SİSTEMİNİ ÇALIŞTIR</button>
            </div>
        </div>

        <div class="center-stage">
            <div class="panel-title" style="width: 100%; margin-bottom: 20px;">💬 KUDURTUCU SÖZÜMÜZ</div>
            <div id="live-troll-text" class="troll-text">YÜKLENİYOR...</div>
        </div>

        <div class="video-box-container">
            <div class="panel-title" style="color:#3b82f6; margin-bottom:15px;">📺 AURA FC CANLI AKIŞ</div>
            <div class="video-wrapper">
                <video autoplay loop muted playsinline>
                    <source src="istockphoto-1629110917-640_adpp_is (1).mp4" type="video/mp4">
                </video>
            </div>
        </div>

        <div id="admin-lock-box" style="display:none; grid-column:1/-1; max-width:400px; margin:0 auto; width:100%; border:2px solid #ef4444; background:var(--glass); padding:20px; border-radius:16px;">
            <input type="password" id="admin-password-field" placeholder="Admin Şifresi">
            <button class="btn" style="background:#ef4444;" onclick="verifyAdminKey()">GİRİŞ</button>
        </div>

        <div id="super-admin-panel" class="admin-section" style="display:none;">
            <h3 style="font-family:'Orbitron'; color:#ef4444; margin-bottom:15px;">🛠️ YÖNETİM</h3>
            <input type="text" id="adm-troll-input" placeholder="Yeni Kudurtucu Sözü Yaz">
            <button class="btn" style="background:#ef4444; margin-bottom:15px;" onclick="updateTrollText()">SÖZÜ GÜNCELLE</button>
            
            <div class="admin-playlist-scroller" id="admin-live-tracks-container"></div>
            <input type="text" id="adm-song-title" placeholder="Şarkı Adı (Örn: Kabede Hacılar)">
            <input type="text" id="adm-song-id" placeholder="GitHub MP3 Dosya Linki (https://.../ses.mp3)">
            <button class="btn" onclick="addNewSong()">ŞARKIYI LİSTEYE EKLE VE ÇAL</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDebenlp7KcVZ2oE90iEHTTl2oEuGFVGKs",
            authDomain: "kartalhaber-49ae6.firebaseapp.com",
            databaseURL: "https://kartalhaber-49ae6-default-rtdb.firebaseio.com",
            projectId: "kartalhaber-49ae6"
        };

        const db = getDatabase(initializeApp(firebaseConfig));
        let isRegisterMode = false, currentActiveMp3Url = "";
        const audio = document.getElementById('imanpower-audio-engine');

        window.toggleFunAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "KAYIT OL" : "GİRİŞ YAP";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "KAYIT" : "GİRİŞ";
        };

        window.handleFunAuth = () => {
            const username = document.getElementById('fun-user-in').value.trim().toLowerCase();
            const password = document.getElementById('fun-pass-in').value;
            if(!username || !password) return;

            if(isRegisterMode) {
                set(ref(db, 'fun_users/' + username), { password }).then(() => { toggleFunAuthMode(); });
            } else {
                onValue(ref(db, 'fun_users/' + username), (snap) => {
                    if(snap.exists() && snap.val().password === password) {
                        document.getElementById('auth-screen').style.display = 'none';
                        // Giriş tıklandığı an sesi canlandırıyoruz!
                        forcePlayMusic();
                    } else { alert("Hatalı Giriş!"); }
                }, { onlyOnce: true });
            }
        };

        window.verifyAdminKey = () => {
            if(document.getElementById('admin-password-field').value === "imanpoweradmini31") {
                document.getElementById('admin-lock-box').style.display = 'none';
                document.getElementById('super-admin-panel').style.display = 'block';
            }
        };

        window.updateTrollText = () => {
            set(ref(db, 'fun_settings/trollText'), document.getElementById('adm-troll-input').value.trim());
        };

        window.addNewSong = () => {
            const title = document.getElementById('adm-song-title').value.trim();
            const url = document.getElementById('adm-song-id').value.trim();
            if(title && url) {
                push(ref(db, 'fun_mp3_songs'), { title, mp3Url: url });
                document.getElementById('adm-song-title').value = ""; 
                document.getElementById('adm-song-id').value = "";
            }
        };

        window.setLiveTrack = (key, url, title) => { 
            set(ref(db, 'fun_current_mp3'), { songKey: key, mp3Url: url, title }); 
        };

        window.forcePlayMusic = () => {
            if(audio && audio.src) {
                audio.play().then(() => {
                    document.getElementById('force-play-btn').innerText = "🔊 SİSTEM AKTİF (ÇALIYOR)";
                    document.getElementById('force-play-btn').style.background = "#3b82f6";
                }).catch(err => {
                    console.log("Tarayıcı engeli: Bir defa tıklanması gerekiyor.");
                });
            }
        };

        // FIREBASE SENKRONİZASYONU
        onValue(ref(db, '/'), (snap) => {
            const data = snap.val() || {};
            document.getElementById('live-troll-text').innerText = data.fun_settings?.trollText || "İman Power!";

            // Canlı MP3 Akışı Kontrolü
            if(data.fun_current_mp3) {
                const targetUrl = data.fun_current_mp3.mp3Url;
                document.getElementById('now-playing-title').innerText = "🎵 " + data.fun_current_mp3.title;
                
                if(targetUrl !== currentActiveMp3Url) {
                    currentActiveMp3Url = targetUrl;
                    audio.src = targetUrl;
                    audio.load();
                    // Şarkı değişince otomatik çalmayı tetikle
                    setTimeout(() => { window.forcePlayMusic(); }, 300);
                }
            }

            // Admin Listesi Güncelleme
            const adminContainer = document.getElementById('admin-live-tracks-container');
            if(adminContainer && data.fun_mp3_songs) {
                adminContainer.innerHTML = "";
                Object.entries(data.fun_mp3_songs).forEach(([k, v]) => {
                    const isPlaying = data.fun_current_mp3?.songKey === k;
                    adminContainer.innerHTML += `
                        <div class="admin-track-item ${isPlaying ? 'active' : ''}" onclick="setLiveTrack('${k}', '${v.mp3Url}', '${v.title}')">
                            <div class="admin-track-info">🎵 ${v.title} ${isPlaying ? '🔥' : ''}</div>
                        </div>`;
                });
            }
        });
    </script>
</body>
</html>
