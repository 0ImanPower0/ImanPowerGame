<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İman Power | Yönetim Odası</title>
    <script src="https://www.youtube.com/iframe_api"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #02040a; --glass: rgba(10, 15, 30, 0.9); --accent: #10b981; }
        body { background: var(--bg); color: white; font-family: 'Poppins', sans-serif; margin: 0; }
        #auth-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #main-content { display: none; padding: 20px; max-width: 800px; margin: 0 auto; }
        .input-box { background: #111; padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .player-footer { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; padding: 10px; border-top: 2px solid var(--accent); z-index: 1000; }
        .btn { background: var(--accent); border: none; padding: 10px 20px; color: white; cursor: pointer; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2 style="color:var(--accent);">EĞLENCE ODASI GİRİŞİ</h2>
        <input type="text" id="user" placeholder="Kullanıcı" style="padding:10px; margin-bottom:10px;">
        <input type="password" id="pass" placeholder="Şifre" style="padding:10px; margin-bottom:10px;">
        <button class="btn" onclick="login()">GİRİŞ YAP</button>
    </div>

    <div id="main-content">
        <h1 style="color:var(--accent);">YÖNETİM PANELİ</h1>
        <div id="admin-panel" class="input-box" style="display:none;">
            <h3>Yönetici Kontrolü</h3>
            <input type="text" id="yt-id" placeholder="YouTube Video ID (Örn: EY07kVGs_Jk)" style="width:100%; padding:10px; margin-bottom:10px;">
            <button class="btn" onclick="updateVideo()">TÜM EKRANLARA GÖNDER</button>
        </div>
        <div id="song-list" class="input-box">
            <h3>Şarkı Listesi</h3>
            <div id="list-container"></div>
        </div>
    </div>

    <div class="player-footer">
        <div style="display:flex; align-items:center; justify-content:space-between; max-width:800px; margin:0 auto;">
            <button class="btn" onclick="startAudio()">🔊 SESİ BAŞLAT</button>
            <input type="range" id="vol" min="0" max="100" value="100" onchange="setVolume(this.value)">
            <div id="yt-player-container"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://kartalhaber-49ae6-default-rtdb.firebaseio.com" };
        const db = getDatabase(initializeApp(firebaseConfig));
        
        let player;
        window.onYouTubeIframeAPIReady = () => {
            player = new YT.Player('yt-player-container', {
                height: '0', width: '0', videoId: 'EY07kVGs_Jk',
                playerVars: { 'autoplay': 1, 'controls': 0, 'mute': 0 }
            });
        };

        window.login = () => {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            if(document.getElementById('user').value === "admin") document.getElementById('admin-panel').style.display = 'block';
        };

        window.updateVideo = () => {
            const id = document.getElementById('yt-id').value;
            set(ref(db, 'current_song'), { videoId: id });
        };

        window.startAudio = () => { if(player) { player.unMute(); player.playVideo(); } };
        window.setVolume = (v) => { if(player) player.setVolume(v); };

        onValue(ref(db, 'current_song'), (snap) => {
            const data = snap.val();
            if(data && player) player.loadVideoById(data.videoId);
        });
    </script>
</body>
</html>
